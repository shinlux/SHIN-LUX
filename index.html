<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>شین لوکس | فروشگاه آرایشی و بهداشتی</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Tahoma, Arial, sans-serif;
}

body {
    background: #f7f7f7;
    color: #222;
}

.app {
    max-width: 600px;
    margin: auto;
    min-height: 100vh;
    background: white;
}

/* Header */

header {
    padding: 20px;
    background: #111;
    color: white;
    text-align: center;
}

.logo {
    font-size: 25px;
    font-weight: bold;
    letter-spacing: 1px;
}

.subtitle {
    margin-top: 7px;
    font-size: 13px;
    color: #ddd;
}

/* Search */

.search-box {
    padding: 15px;
    background: white;
}

.search-box input {
    width: 100%;
    padding: 13px 16px;
    border: 1px solid #ddd;
    border-radius: 12px;
    outline: none;
    font-size: 14px;
    background: #f7f7f7;
}

/* Categories */

.categories {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding: 5px 15px 15px;
}

.category {
    white-space: nowrap;
    border: 1px solid #ddd;
    border-radius: 20px;
    padding: 9px 16px;
    font-size: 13px;
    background: white;
    cursor: pointer;
}

.category.active {
    background: #111;
    color: white;
    border-color: #111;
}

/* Products */

.section-title {
    padding: 10px 15px 15px;
    font-size: 18px;
    font-weight: bold;
}

.products {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    padding: 0 15px 100px;
}

.product {
    border: 1px solid #eee;
    border-radius: 14px;
    overflow: hidden;
    background: white;
}

.product-image {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #f1f1f1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.product-image img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.product-info {
    padding: 12px;
}

.product-name {
    font-size: 14px;
    font-weight: bold;
    line-height: 1.7;
    min-height: 48px;
}

.category-name {
    margin-top: 5px;
    font-size: 11px;
    color: #777;
}

.add-btn {
    width: 100%;
    margin-top: 10px;
    padding: 9px;
    border: none;
    border-radius: 9px;
    background: #111;
    color: white;
    cursor: pointer;
}

/* Bottom navigation */

.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 600px;
    background: white;
    border-top: 1px solid #eee;
    display: flex;
    justify-content: space-around;
    padding: 10px 5px;
}

.nav-item {
    text-align: center;
    font-size: 12px;
    color: #555;
}

.nav-icon {
    display: block;
    font-size: 20px;
    margin-bottom: 4px;
}

</style>
</head>


<body>

<div class="app">

    <!-- Header -->

    <header>

        <div class="logo">
            شین لوکس
        </div>

        <div class="subtitle">
            فروشگاه آرایشی و بهداشتی
        </div>

    </header>


    <!-- Search -->

    <div class="search-box">

        <input
            type="text"
            placeholder="جستجوی محصول..."
        >

    </div>


    <!-- Categories -->

    <div class="categories
